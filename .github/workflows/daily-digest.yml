name: Briefly

on:
  schedule:
    # 02:30 UTC is 08:00 Asia/Kolkata.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: Send the digest and record its articles as sent
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: briefly
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run agent
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          MAX_ARTICLE_AGE_HOURS: ${{ vars.MAX_ARTICLE_AGE_HOURS || '25' }}
          TOP_ARTICLES_COUNT: ${{ vars.TOP_ARTICLES_COUNT || '8' }}
          SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email }}
        run: |
          if [ "$SEND_EMAIL" = "true" ]; then
            python -m app.worker --send
          else
            python -m app.worker
          fi
